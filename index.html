function budgetFeedback(spent,budget){
  if(!budget) return {cls:"good",text:t("noBudget")};
  const ratio=spent/budget;

function recurringReviewItems(){
  const out=[];
  state.cats.forEach((c,ci)=>c.items.forEach((i,ii)=>{
    if(!i.recurring) return;
    const usage=i.usage||'keep';
    if(usage==='rare'||usage==='stop'){
      const monthly=Math.max(0,Number(i.budget)||0);
      if(monthly>0) out.push({c,ci,i,ii,usage,monthly,annual:monthly*12,reviewAt:Number(i.usageMarkedAt)||Date.now()});
    }
  }));
  return out;
}
function monthsSince(ts){
  const days=Math.max(0,(Date.now()-ts)/86400000);
  return Math.floor(days/30.44);
}
function savingsCard(){
  const list=recurringReviewItems();
  if(!list.length) return '';
  const total=list.reduce((a,x)=>a+x.annual,0);
  const rows=list.map(x=>{
    const since=monthsSince(x.reviewAt);
    const sinceText=since>=1 ? '<div class="savings-item-meta">'+L.savingsSince+' : '+eur(x.monthly*since)+'</div>' : '';
    return '<div class="savings-item"><div class="savings-item-top"><span class="savings-item-name">'+labelFor(x.i)+'</span><span class="savings-item-amount">'+eur(x.monthly)+'</span></div><div class="savings-item-meta">'+(x.usage==='stop'?L.savingsStop:L.savingsRare)+' · '+L.savingsMonthly+'</div>'+sinceText+'<div class="savings-actions"><button class="savings-btn" onclick="openExpenseByRef(\''+x.c.id+'\',\''+x.i.id+'\')">✏️ '+L.savingsEdit+'</button></div></div>';
  }).join('');
  return '<section class="savings-card"><div class="savings-head"><span class="savings-icon">🧹</span><span>'+L.savingsTitle+'</span></div><div class="savings-total">'+eur(total)+'</div><div class="savings-note">'+L.savingsAnnual+' · '+L.savingsTotalNote+'</div><div class="savings-list">'+rows+'</div></section>';
}

function saveExpense(){

    i.name=name;i.pt=name;i.en=name;i.budget=b;i.spent=x;i.recurring=rec;i.variable=variable;i.usage=usage;i.period=period;
    if(!rec||(usage==='keep')){i.usageMarkedAt=0}else if(oldUsage!==usage||!i.usageMarkedAt){i.usageMarkedAt=Date.now()}

  md(targetKey)[dataKey]={budget:b,spent:x,recurring:rec,variable:variable,usage:usage,period:period};
  save();closeExpense();render()
}

function checkAnnualEnd(){const completed=new Date().getFullYear()-1;state.annualMeta=state.annualMeta||{seen:{}};state.annualMeta.seen=state.annualMeta.seen||{};if(annualYearHasData(completed)&&!annualSeen(completed)){setTimeout(()=>{markAnnualSeen(completed);openAnnualSummary(completed)},650)}}
function openIncome(){document.getElementById('incomeTitle').textContent='✏️ '+L.editIncome;document.getElementById('incomeSaveLabel').textContent=L.save;document.getElementById('incomeInput').value=state.income;document.getElementById('incomeModal').classList.add('show');setTimeout(()=>document.getElementById('incomeInput').focus(),50)}
function closeIncome(){document.getElementById('incomeModal').classList.remove('show')}
function saveIncome(){let v=Number(document.getElementById('incomeInput').value);if(Number.isFinite(v)&&v>=0){state.income=v;save();closeIncome();render()}}
function openCalendar(){calYear=Number(state.month.slice(0,4));drawCalendar();document.getElementById('calendarModal').classList.add('show')}
function closeCalendar(){document.getElementById('calendarModal').classList.remove('show')}
function calendarYear(v){calYear+=v;drawCalendar()}
function drawCalendar(){document.getElementById('calTitle').textContent='📅 '+L.calendar;document.getElementById('calYear').textContent=calYear;document.getElementById('calPrev').textContent='‹ '+L.prevYear;document.getElementById('calNext').textContent=L.nextYear+' ›';document.getElementById('calChoose').textContent=L.choose;let names=L.months;document.getElementById('monthGrid').innerHTML=names.map((m,i)=>{let active=Number(state.month.slice(0,4))===calYear&&Number(state.month.slice(5,7))===i+1;let label=Number(state.budgetStartDay)===1?m:(()=>{const a=calYear+'-'+String(i+1).padStart(2,'0');const r=cycleDates(a);return dateShort(r.start)+' → '+dateShort(r.end)})();return '<button class=\"month-choice '+(active?'active':'')+'\" onclick=\"chooseMonth('+i+')\">'+label+'</button>'}).join('')}
function chooseMonth(i){state.month=calYear+'-'+String(i+1).padStart(2,'0');save();closeCalendar();render()}
function touch(){let x0=null,a=document.querySelector('.monthbar');a.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});a.addEventListener('touchend',e=>{if(x0===null)return;let dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>45)shift(dx<0?1:-1);x0=null},{passive:true})}
document.querySelector('.fab').onclick=()=>openManage();render();checkCycleEnd();checkAnnualEnd();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
