function budgetFeedback(spent,budget){
  if(!budget) return {cls:"good",text:t("noBudget")};
  const ratio=spent/budget;
  if(ratio>1) return {cls:"over",text:t("overBy")+" "+eur(spent-budget)};

function recurringReviewItems(){
  const out=[];
  state.cats.forEach((c,ci)=>c.items.forEach((i,ii)=>{
    if(!i.recurring) return;
    const usage=i.usage||'keep';
    if(usage==='rare'||usage==='stop'){
      const monthly=Math.max(0,Number(i.budget)||0);
      if(monthly>0) out.push({c,ci,i,ii,usage,monthly,annual:monthly*12,reviewAt:Number(i.usageMarkedAt)||Date.now()});
    }
  }));
  return out;
}
function monthsSince(ts){
  const days=Math.max(0,(Date.now()-ts)/86400000);
  return Math.floor(days/30.44);
}
function savingsCard(){
  const list=recurringReviewItems();
  if(!list.length) return '';
  const total=list.reduce((a,x)=>a+x.annual,0);
  const rows=list.map(x=>{
    const since=monthsSince(x.reviewAt);
    const sinceText=since>=1 ? '<div class="savings-item-meta">'+L.savingsSince+' : '+eur(x.monthly*since)+'</div>' : '';
    return '<div class="savings-item"><div class="savings-item-top"><span class="savings-item-name">'+labelFor(x.i)+'</span><span class="savings-item-amount">'+eur(x.monthly)+'</span></div><div class="savings-item-meta">'+(x.usage==='stop'?L.savingsStop:L.savingsRare)+' · '+L.savingsMonthly+'</div>'+sinceText+'<div class="savings-actions"><button class="savings-btn" onclick="openExpenseByRef(\''+x.c.id+'\',\''+x.i.id+'\')">'+uiIcon('edit')+'<span>'+L.savingsEdit+'</span></button></div></div>';
  }).join('');
  return '<section class="savings-card"><div class="savings-head"><span class="savings-icon">'+uiIcon('broom')+'</span><span>'+L.savingsTitle+'</span></div><div class="savings-total">'+eur(total)+'</div><div class="savings-note">'+L.savingsAnnual+' · '+L.savingsTotalNote+'</div><div class="savings-list">'+rows+'</div></section>';
}

  let i,oldUsage='keep';
  if(ii<0){
    i={id:'item-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name:name,pt:name,en:name,budget:b,spent:x,recurring:rec,variable:variable,usage:usage,usageMarkedAt:(rec&&(usage==='rare'||usage==='stop'))?Date.now():0,period:period};

  }else{
    i=state.cats[ci].items[ii];
    oldUsage=i.usage||'keep';
    i.name=name;i.pt=name;i.en=name;i.budget=b;i.spent=x;i.recurring=rec;i.variable=variable;i.usage=usage;i.period=period;
    if(!rec||(usage==='keep')){i.usageMarkedAt=0}else if(oldUsage!==usage||!i.usageMarkedAt){i.usageMarkedAt=Date.now()}
  }
  const currentKey=state.month,nextMonth=nextKey(state.month),targetKey=period==='next'?nextMonth:currentKey;
  const dataKey=key(state.cats[ci],i);
  if(period==='next') delete md(currentKey)[dataKey];
  else delete md(nextMonth)[dataKey];
  md(targetKey)[dataKey]={budget:b,spent:x,recurring:rec,variable:variable,usage:usage,period:period};
  save();closeExpense();render()
}

  content='<article class="upvanta-panel"><small>PATRIMOINE RENSEIGNÉ</small><div class="upvanta-big">'+eur(sum)+'</div><p class="upvanta-note">Saisis tes comptes et épargnes manuellement. Aucun compte bancaire n’est connecté.</p><button class="upvanta-primary" onclick="addUpvantaAsset()">＋ Ajouter un avoir</button></article>'+(assets.length?assets.map((a,i)=>'<article class="upvanta-list-row"><span class="upvanta-round asset-round">'+uiIcon('wallet')+'</span><div class="upvanta-row-main"><strong>'+escapeUpvanta(a.name)+'</strong><small>Montant renseigné manuellement</small></div><b>'+eur(a.value)+'</b><button class="upvanta-text-button" onclick="editUpvantaAsset('+i+')">Modifier</button><button class="upvanta-text-button danger" onclick="deleteUpvantaAsset('+i+')">×</button></article>').join(''):'<div class="upvanta-empty">Ajoute ton premier compte ou livret pour suivre ton patrimoine ici.</div>');
 }
 root.innerHTML=header+'<div class="upvanta-section-content">'+content+'</div>';
 app.after(root);root.scrollIntoView({block:'start'});
}
function escapeUpvanta(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addUpvantaGoal(){const name=prompt('Nom de l’objectif');if(!name||!name.trim())return;const target=Number(prompt('Montant cible (€)','1000'));if(!Number.isFinite(target)||target<=0)return;const saved=Math.max(0,Number(prompt('Montant déjà épargné (€)','0'))||0);const due=prompt('Échéance (ex. juin 2027), facultatif','')||'';const a=upvantaRead('upvanta-goals-v1');a.push({name:name.trim(),target,saved,due});upvantaWrite('upvanta-goals-v1',a);renderUpvantaSection('goals')}
function editUpvantaGoal(i){const a=upvantaRead('upvanta-goals-v1'),g=a[i];if(!g)return;const saved=prompt('Épargne actuelle (€)',String(g.saved));if(saved===null)return;const value=Number(saved);if(!Number.isFinite(value)||value<0)return;g.saved=value;const target=prompt('Montant cible (€)',String(g.target));if(target!==null&&Number(target)>0)g.target=Number(target);upvantaWrite('upvanta-goals-v1',a);renderUpvantaSection('goals')}
function deleteUpvantaGoal(i){if(!confirm('Supprimer cet objectif ?'))return;const a=upvantaRead('upvanta-goals-v1');a.splice(i,1);upvantaWrite('upvanta-goals-v1',a);renderUpvantaSection('goals')}
function addUpvantaAsset(){const name=prompt('Nom du compte ou livret');if(!name||!name.trim())return;const value=Number(prompt('Solde (€)','0'));if(!Number.isFinite(value)||value<0)return;const a=upvantaRead('upvanta-assets-v1');a.push({name:name.trim(),value});upvantaWrite('upvanta-assets-v1',a);renderUpvantaSection('assets')}
function editUpvantaAsset(i){const a=upvantaRead('upvanta-assets-v1'),x=a[i];if(!x)return;const name=prompt('Nom',x.name);if(name===null)return;const value=prompt('Solde (€)',String(x.value));if(value===null||!Number.isFinite(Number(value))||Number(value)<0)return;x.name=name.trim()||x.name;x.value=Number(value);upvantaWrite('upvanta-assets-v1',a);renderUpvantaSection('assets')}
function deleteUpvantaAsset(i){if(!confirm('Supprimer cet avoir ?'))return;const a=upvantaRead('upvanta-assets-v1');a.splice(i,1);upvantaWrite('upvanta-assets-v1',a);renderUpvantaSection('assets')}


/* First-run guided budget setup. Answers are written into the existing budget model. */
let onboardingStep=0,onboardingData={},onboardingSelectedSubs=[],onboardingSubIndex=0,onboardingBillDay=1,onboardingFrequency={groceries:'variable',restaurants:'variable'};
const onboardingSubs=[{name:'Netflix',glyph:'N',color:'#c94b4b'},{name:'Spotify',glyph:'●',color:'#4e9664'},{name:'Disney+',glyph:'D+',color:'#6477b7'},{name:'Prime Video',glyph:'prime',color:'#4a9bb0'},{name:'YouTube Premium',glyph:'▶',color:'#c94b4b'},{name:'Apple Music',glyph:'♫',color:'#b45e8e'},{name:'Basic Fit',glyph:'B',color:'#e5a34a'},{name:'Amazon Prime',glyph:'a',color:'#6b91b4'},{name:'Autre abonnement',glyph:'+',color:'#748a78'}];
const onboardingSteps=['income','rent','subscriptions','subamount','transport','groceries','restaurants'];
function onboardingOpen(){const modal=document.getElementById('onboardingModal');if(!modal)return;modal.classList.add('show');modal.setAttribute('aria-hidden','false');onboardingStep=0;onboardingData={income:0,rent:0,transport:0,groceries:0,restaurants:0,subscriptions:{}};onboardingSelectedSubs=[];onboardingSubIndex=0;onboardingFrequency={groceries:'variable',restaurants:'variable'};renderOnboardingStep();}
function onboardingClose(){const m=document.getElementById('onboardingModal');m.classList.remove('show');m.setAttribute('aria-hidden','true');}
function onboardingRemaining(){return Math.max(0,(Number(onboardingData.income)||0)-(Number(onboardingData.rent)||0)-(Number(onboardingData.transport)||0)-(Number(onboardingData.groceries)||0)-(Number(onboardingData.restaurants)||0)-Object.values(onboardingData.subscriptions||{}).reduce((a,x)=>a+(Number(x.amount)||0),0));}
function onboardingRenderRing(){const total=Number(onboardingData.income)||0,remain=onboardingRemaining(),pct=total?Math.max(0,Math.min(100,remain/total*100)):0;document.getElementById('onboardingRemaining').textContent=eur(remain);document.getElementById('onboardingRing').style.setProperty('--onboard-progress',pct+'%');}
function onboardingArt(kind){const map={home:'home',daily:'basket',transport:'car',subs:'phone',fun:'heart'};return '<span class="onboarding-category-art">'+uiIcon(map[kind]||'wallet')+'</span>'}
function onboardingItemStep(title,subtitle,key,kind,buttonLabel,opts={}){const val=onboardingData[key]??0;return '<div class="onboarding-item-head">'+onboardingArt(kind)+'<div><strong>'+title+'</strong><small>'+subtitle+'</small></div></div><input class="onboarding-amount" type="number" inputmode="decimal" min="0" step="1" placeholder="0 €" value="'+(val||'')+'" aria-label="'+title+' en euros"><div class="onboarding-field-help">Tu pourras modifier ce montant plus tard</div>'+(opts.day?'':'')+(opts.frequency?'<div class="onboarding-title" style="font-size:16px;margin-top:16px">À quelle fréquence ?</div><div class="onboarding-choice-grid"><button class="onboarding-choice'+(onboardingFrequency[key]==='weekly'?' active':'')+'" onclick="onboardingSetFrequency(\''+key+'\',\'weekly\')"><strong>Chaque semaine</strong><small>Un montant régulier, par semaine</small></button><button class="onboarding-choice'+(onboardingFrequency[key]==='variable'?' active':'')+'" onclick="onboardingSetFrequency(\''+key+'\',\'variable\')"><strong>Ça dépend</strong><small>Un budget variable, au mois</small></button></div>':'')+'<button class="onboarding-primary" onclick="onboardingSaveAmount(\''+key+'\',\''+(opts.frequency?'frequency':'amount')+'\')">'+buttonLabel+'</button><button class="onboarding-secondary" onclick="onboardingSkipStep()">'+(opts.day?'Passer cette étape':'Passer')+'</button>';}
function renderOnboardingStep(){
 const c=document.getElementById('onboardingContent'),p=document.getElementById('onboardingProgress');if(!c)return;
 const step=onboardingSteps[onboardingStep]||'done';p.style.width=Math.min(100,(onboardingStep/(onboardingSteps.length+Math.max(0,onboardingSelectedSubs.length-1)))*100)+'%';onboardingRenderRing();
 let title='',sub='',body='';
 if(step==='income'){title='Pour commencer';sub='Quel est le montant de tes revenus mensuels ?';body=onboardingItemStep('Mes revenus','Revenus nets par mois','income','home','Continuer')}
 else if(step==='rent'){title='Tes dépenses fixes';sub='Commençons par les dépenses qui reviennent chaque mois.';body=onboardingItemStep('Loyer','Montant mensuel','rent','home','Continuer')}
 else if(step==='subscriptions'){title='Tes abonnements';sub='Sélectionne les abonnements que tu paies réellement. Tu pourras compléter les montants ensuite.';body='<div class="onboarding-sub-grid">'+onboardingSubs.map((x,i)=>'<button class="onboarding-sub-option'+(onboardingSelectedSubs.includes(x.name)?' active':'')+'" onclick="onboardingToggleSubName(\''+x.name+'\')"><span class="sub-art" style="color:'+x.color+'">'+x.glyph+'</span><span>'+x.name+'</span></button>').join('')+'</div><button class="onboarding-primary" onclick="onboardingContinueSubs()">Continuer ('+onboardingSelectedSubs.length+')</button><button class="onboarding-secondary" onclick="onboardingSkipStep()">Je n’ai pas d’abonnement</button>'}
 else if(step==='subamount'){const x=onboardingSubs.find(a=>a.name===onboardingSelectedSubs[onboardingSubIndex]);if(!x){onboardingStep++;renderOnboardingStep();return}const existing=onboardingData.subscriptions[x.name]||{amount:0,day:1};onboardingBillDay=existing.day||1;title='Un abonnement à la fois';sub='Renseigne le montant mensuel de '+x.name+'.';body='<div class="onboarding-item-head"><span class="onboarding-category-art" style="color:'+x.color+'">'+x.glyph+'</span><div><strong>'+x.name+'</strong><small>Montant mensuel</small></div><button class="onboarding-secondary" style="margin-left:auto;width:auto" onclick="onboardingSkipSub()">Passer</button></div><input class="onboarding-amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0 €" value="'+(existing.amount||'')+'"><div class="onboarding-field-help">Tu pourras modifier ce montant plus tard</div><button class="onboarding-primary" onclick="onboardingSaveSubscription()">Valider</button><button class="onboarding-secondary" onclick="onboardingSkipSub()">Passer cet abonnement</button>'}
 else if(step==='transport'){title='Le transport';sub='Combien prévois-tu pour tes déplacements chaque mois ?';body=onboardingItemStep('Transport','Budget par mois','transport','transport','Suivant')}
 else if(step==='groceries'){title='Les courses';sub='Définis une première estimation pour ton alimentation.';body=onboardingItemStep('Courses','Budget prévu par mois','groceries','daily','Valider',{frequency:true})}
 else if(step==='restaurants'){title='Les restaurants';sub='Prévois aussi tes repas à l’extérieur si tu le souhaites.';body=onboardingItemStep('Restaurants','Budget prévu par mois','restaurants','fun','Terminer',{frequency:true})}
 else {finishOnboarding();return}
 c.innerHTML='<h1 class="onboarding-title" id="onboardingTitle">'+title+'</h1><p class="onboarding-subtitle">'+sub+'</p>'+body;
 const inp=document.querySelector('#onboardingContent .onboarding-amount');if(inp){inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=c.querySelector('.onboarding-primary');if(b)b.click()}});if(step!=='subscriptions'){inp.focus({preventScroll:true});}}
}
function onboardingSetDay(day){onboardingBillDay=day;document.querySelectorAll('.onboarding-day').forEach((b,i)=>b.classList.toggle('active',i+1===day));}
function onboardingSetFrequency(key,value){const current=document.querySelector('#onboardingContent .onboarding-amount');if(current)onboardingData[key]=Math.max(0,Number(current.value)||0);onboardingFrequency[key]=value;renderOnboardingStep();const inp=document.querySelector('#onboardingContent .onboarding-amount');if(inp){inp.focus();inp.setSelectionRange?.(0,inp.value.length)}}
function onboardingToggleSubName(n){if(onboardingSelectedSubs.includes(n))onboardingSelectedSubs=onboardingSelectedSubs.filter(x=>x!==n);else onboardingSelectedSubs.push(n);renderOnboardingStep()}
function onboardingContinueSubs(){onboardingSubIndex=0;if(onboardingSelectedSubs.length){onboardingStep=onboardingSteps.indexOf('subamount');renderOnboardingStep()}else{onboardingStep=onboardingSteps.indexOf('transport');renderOnboardingStep()}}
function onboardingSkipSub(){onboardingSubIndex++;if(onboardingSubIndex>=onboardingSelectedSubs.length){onboardingStep=onboardingSteps.indexOf('transport')}renderOnboardingStep()}
function onboardingSaveSubscription(){const inp=document.querySelector('#onboardingContent .onboarding-amount'),x=onboardingSubs.find(a=>a.name===onboardingSelectedSubs[onboardingSubIndex]);if(!x)return;onboardingData.subscriptions[x.name]={amount:Math.max(0,Number(inp?.value)||0),day:onboardingBillDay};onboardingSubIndex++;if(onboardingSubIndex>=onboardingSelectedSubs.length)onboardingStep=onboardingSteps.indexOf('transport');renderOnboardingStep()}
function onboardingSaveAmount(key,mode){const inp=document.querySelector('#onboardingContent .onboarding-amount');onboardingData[key]=Math.max(0,Number(inp?.value)||0);if(key==='rent'||key==='transport')onboardingData[key+'Day']=onboardingBillDay;if(key==='income')onboardingStep=onboardingSteps.indexOf('rent');else if(key==='rent')onboardingStep=onboardingSteps.indexOf('subscriptions');else if(key==='transport')onboardingStep=onboardingSteps.indexOf('groceries');else if(key==='groceries')onboardingStep=onboardingSteps.indexOf('restaurants');else if(key==='restaurants'){finishOnboarding();return}renderOnboardingStep()}
function onboardingSkipStep(){const key=onboardingSteps[onboardingStep];if(key==='income')onboardingData.income=0;if(key==='rent')onboardingData.rent=0;if(key==='subscriptions'){onboardingSelectedSubs=[];onboardingData.subscriptions={};onboardingStep=onboardingSteps.indexOf('transport');renderOnboardingStep();return}if(key==='subamount'){onboardingSkipSub();return}if(key==='transport')onboardingData.transport=0;if(key==='groceries')onboardingData.groceries=0;if(key==='restaurants')onboardingData.restaurants=0;if(key==='income')onboardingStep=onboardingSteps.indexOf('rent');else if(key==='rent')onboardingStep=onboardingSteps.indexOf('subscriptions');else if(key==='transport')onboardingStep=onboardingSteps.indexOf('groceries');else if(key==='groceries')onboardingStep=onboardingSteps.indexOf('restaurants');else if(key==='restaurants'){finishOnboarding();return}renderOnboardingStep()}
function onboardingUpsert(catId,name,amount,opts={}){let c=state.cats.find(x=>x.id===catId);if(!c){c={id:catId,name:name,pt:name,en:name,emoji:'',items:[]};state.cats.push(c)}let i=c.items.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!i){i={id:'onboard-'+catId+'-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),name,pt:name,en:name,budget:0,spent:0,recurring:true,variable:!!opts.variable,usage:'keep',usageMarkedAt:0,period:'current'};c.items.push(i)}i.budget=amount;i.recurring=true;i.variable=!!opts.variable;const k=key(c,i);md(state.month)[k]={budget:amount,spent:0,recurring:true,variable:!!opts.variable,period:'current'};}
function finishOnboarding(){state.income=Number(onboardingData.income)||0;onboardingUpsert('home','Loyer',Number(onboardingData.rent)||0);onboardingUpsert('transport','Transport',Number(onboardingData.transport)||0);onboardingUpsert('daily','Courses',Number(onboardingData.groceries)||0,{variable:onboardingFrequency.groceries==='variable'});onboardingUpsert('fun','Restaurants',Number(onboardingData.restaurants)||0,{variable:onboardingFrequency.restaurants==='variable'});Object.entries(onboardingData.subscriptions||{}).forEach(([name,x])=>onboardingUpsert('subs',name,Number(x.amount)||0));save();localStorage.setItem('upvanta-onboarding-complete','1');onboardingClose();render();window.scrollTo({top:0,behavior:'smooth'})}
function skipOnboarding(){localStorage.setItem('upvanta-onboarding-complete','1');onboardingClose()}

function touch(){let x0=null,a=document.querySelector('.monthbar');a.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});a.addEventListener('touchend',e=>{if(x0===null)return;let dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>45)shift(dx<0?1:-1);x0=null},{passive:true})}
document.querySelector('.fab').onclick=()=>openManage();render();if(!localStorage.getItem('upvanta-onboarding-complete'))onboardingOpen();checkCycleEnd();checkAnnualEnd();
</script>

  });
