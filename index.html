let lang=localStorage.getItem('budget-lang')||'fr'; if(!T[lang]) lang='fr'; let L=T[lang],now=new Date();
let state=JSON.parse(localStorage.getItem('budget-samara-v1')||'null')||{month:now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),income:2000,cats:[['home','Logement','Moradia','Housing','🏠',['Loyer','Aluguel','Rent'],['Électricité','Eletricidade','Electricity'],['Internet','Internet','Internet']],['daily','Vie quotidienne','Vida cotidiana','Daily life','🛒',['Courses','Compras','Groceries'],['Produits ménagers','Produtos de limpeza','Household products']],['transport','Transport','Transporte','Transport','🚗',['Voiture / essence','Carro / combustível','Car / fuel'],['Transports','Transporte','Transportation']],['subs','Abonnements','Assinaturas','Subscriptions','📱',['Téléphone','Telefone','Phone'],['Streaming','Streaming','Streaming']],['fun','Loisirs','Lazer','Leisure','❤️',['Sorties','Passeios','Outings'],['Restaurants','Restaurantes','Restaurants']],['beauty','Beauté & soins','Beleza e cuidados','Beauty & care','💇',['Coiffeur','Cabeleireiro','Hairdresser']]].map(x=>({id:x[0],name:x[1],pt:x[2],en:x[3],emoji:x[4],items:x.slice(5).map(v=>({name:v[0],pt:v[1],en:v[2],budget:0,spent:0,recurring:false}))})),data:{}};
function ensureIds(){state.cats.forEach((c,ci)=>{if(!c.id)c.id='cat-'+ci+'-'+Date.now();c.items.forEach((i,ii)=>{if(!i.id)i.id='item-'+ci+'-'+ii+'-'+Math.random().toString(36).slice(2,8)})})}
ensureIds();
function save(){localStorage.setItem('budget-samara-v1',JSON.stringify(state))} function md(k){return state.data[k]||(state.data[k]={})} function key(c,i){return c.id+'|'+i.name}
function prev(k){let[y,m]=k.split('-').map(Number);m--;if(m<1){m=12;y--}return y+'-'+String(m).padStart(2,'0')}
function get(c,i,k=state.month){return md(k)[key(c,i)]||null} function bud(c,i){let x=get(c,i);if(x&&x.budget!=null)return x.budget;for(let k=prev(state.month),n=0;n<120;n++,k=prev(k)){let q=get(c,i,k);if(q&&q.recurring)return q.budget||0}return 0} function sp(c,i){let x=get(c,i);return x&&x.spent||0}
function eur(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n)} function total(){return state.cats.reduce((a,c)=>a+c.items.reduce((b,i)=>b+sp(c,i),0),0)}

function budgetFeedback(spent,budget){
  if(!budget) return {cls:"good",text:t("noBudget")};
  const ratio=spent/budget;
  if(ratio>1) return {cls:"over",text:t("overBy")+" "+eur(spent-budget)};
  if(ratio>=0.8) return {cls:"warn",text:t("almost")+" "+eur(budget-spent)};
  return {cls:"good",text:t("left")+" "+eur(budget-spent)};
}

let lastTip=Number(localStorage.getItem('budget-last-tip'));
let currentTip=Number.isInteger(lastTip)&&lastTip>=0&&lastTip<FINANCE_TIPS.fr.length ? (lastTip+1+Math.floor(Math.random()*(FINANCE_TIPS.fr.length-1)))%FINANCE_TIPS.fr.length : Math.floor(Math.random()*FINANCE_TIPS.fr.length);

function cat(c){let B=c.items.reduce((a,i)=>a+bud(c,i),0),X=c.items.reduce((a,i)=>a+sp(c,i),0),P=B?Math.min(100,X/B*100):0;return '<section class="card"><div class="cathead"><div class="emoji">'+c.emoji+'</div><div class="catname">'+labelFor(c)+'</div><div class="catamount"><strong>'+eur(X)+'</strong><small>'+(B?eur(B):L.none)+'</small></div></div><div class="bar"><div class="fill '+(X>B&&B?'over':'')+'" style="width:'+P+'%"></div></div><div class="sub"><span>'+(B?L.planned+' '+eur(B):L.free)+'</span><span>'+(B?(X>B?L.over:L.left+' '+eur(B-X)):'')+'</span></div>'+c.items.map((i,n)=>item(c,i,n)).join('')+'<button class="add" onclick="openExpenseByRef(\''+c.id+'\',null)">'+L.add+'</button></section>'}
function item(c,i,n){let b=bud(c,i),x=sp(c,i),p=b?Math.min(100,x/b*100):0;return '<div class="row" onclick="openExpenseByRef(\''+c.id+'\',\''+i.id+'\')" style="cursor:pointer"><div class="rowname"><b>'+labelFor(i)+'</b><small>'+L.planned+' '+eur(b)+'</small><div class="itembar"><div class="itemfill '+(x>b&&b?'over':'')+'" style="width:'+p+'%"></div></div></div><div class="money">'+eur(x)+'</div><div class="expense-actions"><button class="row-action" onclick="event.stopPropagation();openExpenseByRef(\''+c.id+'\',\''+i.id+'\')">✏️</button><button class="row-action danger" onclick="event.stopPropagation();deleteExpenseByRef(\''+c.id+'\',\''+i.id+'\')">🗑️</button></div></div>'}
function openExpenseByRef(catId,itemId){let ci=state.cats.findIndex(c=>c.id===catId);if(ci<0)return;let ii=itemId===null?-1:state.cats[ci].items.findIndex(i=>i.id===itemId);if(itemId!==null&&ii<0)return;openExpense(ci,ii)}
function deleteExpenseByRef(catId,itemId){let ci=state.cats.findIndex(c=>c.id===catId);if(ci<0)return;let ii=state.cats[ci].items.findIndex(i=>i.id===itemId);if(ii<0)return;deleteExpense(ci,ii)}
let editingExpense={ci:-1,ii:-1};
function openExpense(ci,ii){editingExpense={ci,ii};let isNew=ii<0,c=isNew?state.cats[ci]:state.cats[ci],i=isNew?{name:'',pt:'',en:'',budget:0,spent:0,recurring:false}:c.items[ii];document.getElementById('expenseTitle').textContent=isNew?'➕ '+L.addExpenseTitle:'✏️ '+L.editExpenseTitle;document.getElementById('expenseNameLabel').textContent=L.expenseName;document.getElementById('expenseBudgetLabel').textContent=L.expenseBudget;document.getElementById('expenseSpentLabel').textContent=L.expenseSpent;document.getElementById('expenseRecurringLabel').textContent=L.recurring;document.getElementById('expenseNameInput').value=labelFor(i);document.getElementById('expenseBudgetInput').value=i.budget||0;document.getElementById('expenseSpentInput').value=i.spent||0;document.getElementById('expenseRecurringInput').checked=!!i.recurring;document.getElementById('expenseSaveBtn').textContent=L.save;document.getElementById('expenseDeleteBtn').textContent=L.deleteExpense;document.getElementById('expenseDeleteBtn').style.display=isNew?'none':'block';document.getElementById('expenseModal').classList.add('show');setTimeout(()=>document.getElementById('expenseNameInput').focus(),50)}
function closeExpense(){document.getElementById('expenseModal').classList.remove('show')}
function saveExpense(){let ci=editingExpense.ci,ii=editingExpense.ii,name=document.getElementById('expenseNameInput').value.trim();if(!name)return;let b=Math.max(0,Number(document.getElementById('expenseBudgetInput').value)||0),x=Math.max(0,Number(document.getElementById('expenseSpentInput').value)||0),rec=document.getElementById('expenseRecurringInput').checked;let i;if(ii<0){i={id:'item-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name:name,pt:name,en:name,budget:b,spent:x,recurring:rec};state.cats[ci].items.push(i)}else{i=state.cats[ci].items[ii];i.name=name;i.pt=name;i.en=name;i.budget=b;i.spent=x;i.recurring=rec}md(state.month)[key(state.cats[ci],i)]={budget:b,spent:x,recurring:rec};save();closeExpense();render()}
function deleteExpense(ci,ii){if(!confirm(L.deleteExpense+' ?'))return;state.cats[ci].items.splice(ii,1);save();render()}
function deleteCurrentExpense(){if(editingExpense.ii<0)return;deleteExpense(editingExpense.ci,editingExpense.ii);closeExpense()}

function openManage(){renderManage();document.getElementById('manageModal').classList.add('show')}
function closeManage(){document.getElementById('manageModal').classList.remove('show')}
function labelFor(o){return lang==='fr'?o.name:(lang==='pt'?o.pt:o.en)}
function renderManage(){const body=document.getElementById('manageBody');document.getElementById('manageTitle').textContent='⚙️ '+L.manage;const groups={daily:{fr:'Quotidien',pt:'Dia a dia',en:'Everyday'},family:{fr:'Famille & maison',pt:'Família e casa',en:'Family & home'},projects:{fr:'Projets & loisirs',pt:'Projetos e lazer',en:'Projects & leisure'},finance:{fr:'Budget & finances',pt:'Orçamento e finanças',en:'Budget & finance'}};const order=['daily','family','projects','finance'];const recommendationHtml=order.map(g=>{const list=TEMPLATES.filter(t=>t.group===g);return '<div class="template-group"><div class="template-group-title">'+groups[g][lang]+'</div><div class="template-grid">'+list.map(t=>{const added=state.cats.some(c=>c.id==='tpl-'+t.id);return '<button class="template'+(added?' is-added':'')+'" '+(added?'disabled':'onclick="useTemplate(\''+t.id+'\')"')+'>'+t.emoji+' '+(lang==='fr'?t.fr:(lang==='pt'?t.pt:t.en))+(added?'<span class="template-check">✓</span>':'')+'</button>'}).join('')+'</div></div>'}).join('');body.innerHTML='<div class="manage-actions"><button class="full-btn" onclick="newCategory()">'+L.addCat+'</button></div><div class="manage-section"><h3>'+L.manage+'</h3><div class="manage-list">'+state.cats.map((c,idx)=>'<div class="manage-card"><div class="manage-head"><span class="emoji">'+c.emoji+'</span><span class="manage-name">'+labelFor(c)+'</span><button class="mini-btn" onclick="renameCategory('+idx+')">✏️</button><button class="mini-btn danger" onclick="deleteCategory('+idx+')">🗑️</button></div><div class="manage-items">'+(c.items.length?c.items.map((i,n)=>'<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0"><span>'+labelFor(i)+'</span><span><button class="mini-btn" onclick="renameItem('+idx+','+n+')">✏️</button><button class="mini-btn danger" onclick="deleteItem('+idx+','+n+')">🗑️</button></span></div>').join(''):'<span>'+L.noItems+'</span>')+'</div><button class="ghost-btn" onclick="newItem('+idx+')">'+L.addItem+'</button></div>').join('')+'</div></div><div class="manage-section recommendations"><h3>'+L.templates+'</h3><div class="empty-note">'+(lang==='fr'?'Choisis une catégorie pour ajouter rapidement les lignes adaptées.':lang==='pt'?'Escolha uma categoria para adicionar rapidamente as linhas adequadas.':'Choose a category to quickly add the right budget lines.')+'</div>'+recommendationHtml+'</div>'}
let entryState={type:null,ci:-1,ii:-1};
function openEntry(type,ci=-1,ii=-1){entryState={type,ci,ii};const isCat=type==='category';const isEdit=(ci>=0)||(ii>=0);const c=ci>=0?state.cats[ci]:null;const item=(c&&ii>=0)?c.items[ii]:null;document.getElementById('entryTitle').textContent=isCat?(isEdit?'✏️ Modifier la catégorie':'➕ Créer une catégorie'):(isEdit?'✏️ Modifier la ligne':'➕ Ajouter une ligne');document.getElementById('entryNameLabel').textContent=isCat?L.catName:L.itemName;document.getElementById('entryNameInput').value=isCat?(c?labelFor(c):''):(item?labelFor(item):'');document.getElementById('entryIconWrap').style.display=isCat?'block':'none';document.getElementById('entryIconLabel').textContent=L.icon;document.getElementById('entryIconInput').value=isCat?(c?c.emoji:'📁'):'';document.getElementById('entryCancelBtn').textContent=L.cancel;document.getElementById('entrySaveBtn').textContent=L.create;document.getElementById('entryModal').classList.add('show');setTimeout(()=>document.getElementById('entryNameInput').focus(),50)}
function closeEntry(){document.getElementById('entryModal').classList.remove('show');entryState={type:null,ci:-1,ii:-1}}
function saveEntry(){const name=document.getElementById('entryNameInput').value.trim();if(!name)return;const {type,ci,ii}=entryState;if(type==='category'){const icon=document.getElementById('entryIconInput').value.trim()||'📁';if(ci>=0){let c=state.cats[ci];c.name=name;c.pt=name;c.en=name;c.emoji=icon}else{state.cats.push({id:'custom-'+Date.now(),name:name,pt:name,en:name,emoji:icon,items:[]})}}else if(ci>=0){const c=state.cats[ci];if(ii>=0){let i=c.items[ii];i.name=name;i.pt=name;i.en=name}else{c.items.push({id:'item-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name:name,pt:name,en:name,budget:0,spent:0,recurring:false})}}save();closeEntry();render();renderManage()}
function newCategory(){openEntry('category')}
function renameCategory(idx){openEntry('category',idx,-1)}
function deleteCategory(idx){if(!confirm(L.confirmDelete))return;state.cats.splice(idx,1);save();render();renderManage()}
function newItem(idx){openEntry('item',idx,-1)}
function renameItem(ci,ii){openEntry('item',ci,ii)}
function deleteItem(ci,ii){state.cats[ci].items.splice(ii,1);save();render();renderManage()}
function useTemplate(id){let t=TEMPLATES.find(x=>x.id===id);if(!t)return;if(state.cats.some(c=>c.id==='tpl-'+id)){alert(L.templateAdded);return}state.cats.push({id:'tpl-'+id,name:t.fr,pt:t.pt,en:t.en,emoji:t.emoji,items:t.items.map(v=>({id:'item-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name:v[0],pt:v[1],en:v[2],budget:0,spent:0,recurring:false}))});save();render();renderManage()}
function toggleLangMenu(e){e.stopPropagation();document.getElementById('langMenu')?.classList.toggle('show')} function setLang(k,e){e.stopPropagation();lang=k;L=T[lang];localStorage.setItem('budget-lang',lang);render()} document.addEventListener('click',()=>document.getElementById('langMenu')?.classList.remove('show'))
function shift(v){let d=new Date(Number(state.month.slice(0,4)),Number(state.month.slice(5,7))-1+v,1);state.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');save();render()}
let calYear=Number(state.month.slice(0,4));
function openIncome(){document.getElementById('incomeTitle').textContent='✏️ '+L.editIncome;document.getElementById('incomeSaveLabel').textContent=L.save;document.getElementById('incomeInput').value=state.income;document.getElementById('incomeModal').classList.add('show');setTimeout(()=>document.getElementById('incomeInput').focus(),50)}
function closeIncome(){document.getElementById('incomeModal').classList.remove('show')}
function saveIncome(){let v=Number(document.getElementById('incomeInput').value);if(Number.isFinite(v)&&v>=0){state.income=v;save();closeIncome();render()}}
function openCalendar(){calYear=Number(state.month.slice(0,4));drawCalendar();document.getElementById('calendarModal').classList.add('show')}
function closeCalendar(){document.getElementById('calendarModal').classList.remove('show')}
function calendarYear(v){calYear+=v;drawCalendar()}
function drawCalendar(){document.getElementById('calTitle').textContent='📅 '+L.calendar;document.getElementById('calYear').textContent=calYear;document.getElementById('calPrev').textContent='‹ '+L.prevYear;document.getElementById('calNext').textContent=L.nextYear+' ›';document.getElementById('calChoose').textContent=L.choose;let names=L.months;document.getElementById('monthGrid').innerHTML=names.map((m,i)=>{let active=Number(state.month.slice(0,4))===calYear&&Number(state.month.slice(5,7))===i+1;return '<button class=\"month-choice '+(active?'active':'')+'\" onclick=\"chooseMonth('+i+')\">'+m+'</button>'}).join('')}
function chooseMonth(i){state.month=calYear+'-'+String(i+1).padStart(2,'0');save();closeCalendar();render()}
function touch(){let x0=null,a=document.querySelector('.monthbar');a.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});a.addEventListener('touchend',e=>{if(x0===null)return;let dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>45)shift(dx<0?1:-1);x0=null},{passive:true})}
