name: ESMA FIRDS bulk bond import

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/esma-firds-bulk-import.yml'
      - 'scripts/bonds_catalog.py'
      - 'scripts/audit_bonds_catalog.py'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Number of days to search in ESMA publication registry'
        required: true
        default: '21'
  schedule:
    - cron: '30 7 * * 1'

permissions:
  contents: read

jobs:
  fetch-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run existing offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Build isolated ESMA catalogue preview and audit it
        env:
          BONDS_LOOKBACK_DAYS: ${{ inputs.lookback_days || '21' }}
          BONDS_CATALOG_OUT: run-v38-esma-audit/bond-catalog-preview.json
        run: |
          mkdir -p run-v38-esma-audit
          python scripts/bonds_catalog.py
          python scripts/audit_bonds_catalog.py run-v38-esma-audit/bond-catalog-preview.json > run-v38-esma-audit/audit-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          catalogue_path = Path("run-v38-esma-audit/bond-catalog-preview.json")
          report_path = Path("run-v38-esma-audit/audit-report.json")
          catalogue = json.loads(catalogue_path.read_text(encoding="utf-8"))
          report = json.loads(report_path.read_text(encoding="utf-8"))
          records = catalogue.get("records")
          if not isinstance(records, list) or not records:
              raise SystemExit("ESMA preview is empty or has no records array.")
          isins = [record.get("isin") for record in records if isinstance(record, dict)]
          if len(isins) != len(records) or any(not isin for isin in isins):
              raise SystemExit("ESMA preview contains a malformed record or missing ISIN.")
          if len(set(isins)) != len(isins):
              raise SystemExit("ESMA preview contains duplicate ISINs.")
          if catalogue.get("recordCount") != len(records):
              raise SystemExit("Catalogue recordCount does not match records length.")
          if report.get("recordCount") != len(records):
              raise SystemExit("Audit recordCount does not match catalogue records.")
          print(f"Validated isolated preview: {len(records)} unique ISINs; canonical catalogue unchanged.")
          PY

      - name: Upload ESMA preview and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esma-firds-bond-audit-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: run-v38-esma-audit/
