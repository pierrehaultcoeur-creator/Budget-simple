name: ESMA FIRDS bulk bond import

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Number of days to search in ESMA publication registry'
        required: true
        default: '21'
  schedule:
    - cron: '30 7 * * 1'

permissions:
  contents: read

jobs:
  fetch-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run offline regression tests
        run: |
          python engine/test-esma-firds-bulk-fetch-v37.py
          python engine/test-bond-bulk-ingestion-v36.py

      - name: Discover and download latest complete ESMA debt reference files
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '21' }}
        run: |
          python engine/esma-firds-bulk-fetch-v37.py --days "$LOOKBACK_DAYS" --out data/esma-firds-full

      - name: Run ingestion audit without modifying the canonical master
        shell: bash
        run: |
          shopt -s nullglob
          files=(data/esma-firds-full/FULINS_D_*.zip)
          if (( ${#files[@]} == 0 )); then
            echo 'No verified FULINS_D ZIP files found.' >&2
            exit 2
          fi
          python engine/bond-bulk-ingestion-v36.py \
            --master data/bond-master-reconciled-v34.json \
            --firds "${files[@]}" \
            --out run-v38-esma-audit

      - name: Upload fetch manifest and ingestion audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esma-firds-bond-audit-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/esma-firds-full/
            run-v38-esma-audit/
