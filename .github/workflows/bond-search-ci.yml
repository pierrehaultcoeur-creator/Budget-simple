name: Bond search CI

on:
  push:
    branches:
      - feature/bond-search-index
    paths:
      - 'netlify/functions/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'investissement.html'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bond-search-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run offline parser and catalogue-index tests
        run: python -m unittest tests.test_bonds_catalog tests.test_split_bonds_catalog tests.test_audit_bonds_catalog

      - name: Run bond search regression tests
        run: node --test netlify/functions/bond-search.test.js

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          for html in ("index.html", "investissement.html"):
              source = Path(html).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\\b[^>]*>(.*?)</script>", source, re.I | re.S)
              for number, script in enumerate(scripts, 1):
                  if not script.strip():
                      continue
                  target = Path("/tmp") / f"{Path(html).stem}-{number}.js"
                  target.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(target)], check=True)
                  print(f"JavaScript syntax OK: {html} script {number}")
          PY
