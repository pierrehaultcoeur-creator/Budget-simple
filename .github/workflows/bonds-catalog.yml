
name: Update bonds catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate bonds catalog
        run: python scripts/bonds_catalog.py

      - name: Check generated catalog
        run: python -m json.tool data/bonds-catalog.json > /dev/null

      - name: Commit catalog
        run: |
          if [ -n "$(git status --porcelain data/bonds-catalog.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/bonds-catalog.json
            git commit -m "Update bonds catalog"
            git push
          fi
          
