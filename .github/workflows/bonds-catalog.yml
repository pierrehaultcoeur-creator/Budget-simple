name: Build ESMA bond catalogue

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bond-search-index
  schedule:
    # Sundays at 10:30 UTC, after ESMA's weekly full-file publication window.
    - cron: "30 10 * * 0"

permissions:
  contents: write

concurrency:
  group: bonds-catalogue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline parser regression test
        run: python -m unittest tests.test_bonds_catalog tests.test_split_bonds_catalog tests.test_audit_bonds_catalog

      - name: Build catalogue from ESMA
        run: python scripts/bonds_catalog.py
        env:
          BONDS_MIN_RECORDS: "1"

      - name: Validate and split catalogue into GitHub-safe shards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/bonds-catalog.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["source"] == "ESMA FIRDS"
          assert data["recordCount"] == len(data["records"])
          assert data["recordCount"] > 0
          isins = [r["isin"] for r in data["records"]]
          assert len(isins) == len(set(isins)), "Duplicate ISINs found"
          assert all(r.get("cfi", "").startswith("D") for r in data["records"])
          print(f"Validated {len(isins)} unique debt instruments.")
          PY
          python scripts/audit_bonds_catalog.py data/bonds-catalog.json > bond-catalog-quality-report.json
          cat bond-catalog-quality-report.json
          python scripts/split_bonds_catalog.py data/bonds-catalog.json data/bonds-catalog
          rm data/bonds-catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("data/bonds-catalog/manifest.json").read_text(encoding="utf-8"))
          assert manifest["recordCount"] > 0
          assert manifest["partCount"] == len(manifest["parts"])
          assert all(part["bytes"] < 100 * 1024 * 1024 for part in manifest["parts"])
          assert sum(item["entries"] for item in manifest.get("isinIndexes", [])) == manifest["recordCount"]
          assert all(item["bytes"] < 100 * 1024 * 1024 for item in manifest.get("isinIndexes", []))
          assert all((Path("data/bonds-catalog") / item["file"]).exists() for item in manifest.get("isinIndexes", []))
          print(f"Validated {manifest['recordCount']} records, {manifest['partCount']} shards and {len(manifest.get('isinIndexes', []))} ISIN indexes.")
          PY

      - name: Test exact and partial ISIN search
        run: node --test netlify/functions/bond-search.test.js

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          for html in ("index.html", "investissement.html"):
              source = Path(html).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", source, re.I | re.S)
              for number, script in enumerate(scripts, 1):
                  if not script.strip():
                      continue
                  target = Path("/tmp") / f"{Path(html).stem}-{number}.js"
                  target.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(target)], check=True)
                  print(f"JavaScript syntax OK: {html} script {number}")
          PY

      - name: Commit catalogue shards only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bonds-catalog/
          if git diff --cached --quiet; then
            echo "Catalogue unchanged; no commit needed."
          else
            git commit -m "Update ESMA bond catalogue"
            git push
          fi
